<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="petirGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FEF08A" />
      <stop offset="35%" stopColor="#FACC15" />
      <stop offset="70%" stopColor="#EAB308" />
      <stop offset="100%" stopColor="#CA8A04" />
    </linearGradient>
    <filter id="petirGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FACC15" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Clean Black Round Disc for dark theme & browser tab contrast -->
  <circle cx="64" cy="64" r="62" fill="#09090b" stroke="#EAB308" stroke-width="2.5" />

  <!-- The Bold "G" Emblem -->
  <!-- Outer circle cutout + inner circle cutout forming the thick 'G' loop -->
  <path
    d="M 64 16
       A 48 48 0 1 0 112 64
       L 72 64
       L 72 78
       L 98 78
       A 34 34 0 1 1 64 30
       C 76 30 86 35 93 43
       L 104 32
       C 94 22 80 16 64 16 Z"
    fill="#ffffff"
  />

  <!-- Masking notch for the lightning passage on the G loop -->
  <!-- Dynamic Lightning Bolt (Petir) Slicing Diagonally -->
  <polygon
    points="82,10 48,56 68,54 44,118 80,68 60,70"
    fill="url(#petirGold)"
    stroke="#09090b"
    stroke-width="2"
    stroke-linejoin="miter"
    filter="url(#petirGlow)"
  />
</svg>
